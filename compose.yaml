services:
  crafty-discord-bot:
    build: .
    image: crafty-discord-bot:latest
    container_name: crafty-discord-bot
    restart: unless-stopped
    init: true

    # Template only: replace every placeholder, then run `docker compose up -d --build`.
    environment:
      DISCORD_TOKEN: "your_discord_bot_token"
      CRAFTY_BASE_URL: "https://your-crafty-host:8443"
      CRAFTY_API_TOKEN: "your_crafty_api_jwt"
      DEFAULT_SERVER_ID: "your_crafty_server_uuid"

      # Optional: only used when CRAFTY_API_TOKEN is empty
      CRAFTY_USERNAME: ""
      CRAFTY_PASSWORD: ""
      CRAFTY_TOTP: ""

      CRAFTY_VERIFY_SSL: "false"
      SERVER_IP: ""
      SERVER_PORT: ""
      PUBLIC_IP: ""
      MAP_URL: "https://map.example.com/"
      SERVER_VERSION: "your_minecraft_version"

      # /stop and /restart require both IDs. Empty = disabled.
      STOP_RESTART_GUILD_ID: "your_discord_guild_id"
      STOP_RESTART_ROLE_ID: "your_discord_role_id"
      TEST_GUILD_ID: ""

    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
